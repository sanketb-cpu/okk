name: NSE Market Lens alerts

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These cover 09:15-15:30 Asia/Kolkata on weekdays.
    - cron: "45-59/5 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"

concurrency:
  group: nse-market-lens-alerts
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATA_SOURCE: "nse_api"
      NSE_API_BUCKET: "allSec"
      THRESHOLD_PERCENT: "10"
      ALLOW_REPEAT_ALERTS: "true"
      CHECK_EVERY_SECONDS: "300"
      HEADLESS: "true"
      AUTO_START: "true"
      RUN_ONCE: "true"
      SEND_STARTUP_MESSAGE: "false"
      CHECK_OUTSIDE_MARKET_HOURS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one market check
        run: python market_lens_alerts.py
